name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared
        run: npm run build:shared

      - name: Sync and build functions
        run: npm run sync:functions && npm run build:functions

      - name: Build website
        run: npm run build:website

      - name: Build dashboard
        run: npm run build:dashboard

      - name: Test website
        run: npm run test -w @unidealz/website

      - name: Test dashboard
        run: npm run test -w @unidealz/dashboard
